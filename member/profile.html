<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - IronTemple</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/portal.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="portal-body">
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <a class="portal-brand" href="dashboard.html"><span class="brand-icon"><i class="fa-solid fa-dumbbell"></i></span> IronTemple</a>
      <nav class="portal-nav" aria-label="Member navigation">
        <span class="nav-section">My account</span>
        <a href="dashboard.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
        <a class="active" href="profile.html"><i class="fa-solid fa-user"></i> My profile</a>
        <a href="membership.html"><i class="fa-solid fa-id-card"></i> Membership</a>
        <a href="bookings.html"><i class="fa-solid fa-calendar-check"></i> My bookings</a>
        <a href="payments.html"><i class="fa-solid fa-credit-card"></i> Payments</a>
        <span class="nav-section">Progress</span>
        <a href="workout-plans.html"><i class="fa-solid fa-dumbbell"></i> Workout plans</a>
        <a href="attendance.html"><i class="fa-solid fa-chart-line"></i> Attendance</a>
        <a href="bmi-history.html"><i class="fa-solid fa-heart-pulse"></i> BMI history</a>
      </nav>
      <div class="portal-sidebar-footer"><a class="portal-nav-link text-white" href="../index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</a></div>
    </aside>
    <main class="portal-main">
      <header class="portal-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light portal-mobile-toggle" data-portal-menu aria-expanded="false" aria-label="Open member navigation"><i class="fa-solid fa-bars"></i></button>
          <div><strong>My profile</strong><div class="small text-muted">View and edit your personal information</div></div>
        </div>
        <div class="d-flex align-items-center gap-2"><span class="portal-avatar">AK</span><span class="d-none d-sm-inline">Ananya Kapoor</span></div>
      </header>
      <div class="portal-content">
        <div class="portal-page-heading">
          <div>
            <h1>Profile</h1>
            <p class="text-muted">Manage your contact details and account settings.</p>
          </div>
          <button class="btn btn-primary" data-demo-action="Profile update is demo action."><i class="fa-solid fa-save me-2"></i>Save changes</button>
        </div>

        <section class="portal-card">
          <div class="portal-card-body">
            <form id="profileForm" action="" method="POST" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="fullName">Full name</label>
                  <input id="fullName" name="full_name" class="form-control" value="Ananya Kapoor" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="email">Email</label>
                  <input id="email" name="email" type="email" class="form-control" value="ananya@example.com" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="phone">Mobile</label>
                  <input id="phone" name="phone" class="form-control" value="+91 98765 43210" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="dob">Date of birth</label>
                  <input id="dob" name="dob" type="date" class="form-control" value="1996-07-12" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="address">Address</label>
                  <input id="address" name="address" class="form-control" value="Sector 17, City" />
                </div>
              </div>
            </form>
          </div>
        </section>

      </div>
    </main>
  </div>
  <script src="../js/portal.js"></script>
</body>
</html>
