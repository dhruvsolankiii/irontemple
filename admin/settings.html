<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - IronTemple Admin</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/portal.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="portal-body">
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <a class="portal-brand" href="dashboard.html"><span class="brand-icon"><i class="fa-solid fa-dumbbell"></i></span> IronTemple</a>
      <nav class="portal-nav" aria-label="Admin navigation">
        <span class="nav-section">Overview</span>
        <a href="dashboard.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
        <span class="nav-section">Management</span>
        <a href="members.html"><i class="fa-solid fa-users"></i> Members</a>
        <a href="memberships.html"><i class="fa-solid fa-tags"></i> Memberships</a>
        <a href="trainers.html"><i class="fa-solid fa-person-running"></i> Trainers</a>
        <a href="bookings.html"><i class="fa-solid fa-calendar-check"></i> Bookings</a>
        <a href="payments.html"><i class="fa-solid fa-credit-card"></i> Payments</a>
        <span class="nav-section">Operations</span>
        <a href="attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance</a>
        <a href="messages.html"><i class="fa-solid fa-envelope"></i> Messages</a>
        <a class="active" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
      <div class="portal-sidebar-footer"><a class="portal-nav-link text-white" href="../index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit portal</a></div>
    </aside>
    <main class="portal-main">
      <header class="portal-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light portal-mobile-toggle" data-portal-menu aria-expanded="false" aria-label="Open admin navigation"><i class="fa-solid fa-bars"></i></button>
          <div><strong>Settings</strong><div class="small text-muted">General account and operational preferences</div></div>
        </div>
        <div class="d-flex align-items-center gap-2"><span class="portal-avatar">DS</span><span class="d-none d-sm-inline">Dhruv Solanki</span></div>
      </header>
      <div class="portal-content">
        <div class="alert alert-success d-none" data-portal-alert role="status"></div>
        <div class="portal-page-heading"><div><h1>Settings</h1><p class="text-muted">Configure gym preferences and staff settings.</p></div><button class="btn btn-primary" data-crud-action="Settings save flow is demo action."><i class="fa-solid fa-floppy-disk me-2"></i>Save changes</button></div>
        <div class="row g-4">
          <div class="col-lg-6"><section class="portal-card"><div class="portal-card-header"><h2>General</h2></div><div class="portal-card-body">
            <div class="mb-3"><label class="form-label">Gym name</label><input class="form-control" value="IronTemple" /></div>
            <div class="mb-3"><label class="form-label">Admin email</label><input class="form-control" value="admin@irontemple.com" /></div>
            <div class="mb-3"><label class="form-label">Timezone</label><input class="form-control" value="Asia/Kolkata" /></div>
          </div></section></div>
          <div class="col-lg-6"><section class="portal-card"><div class="portal-card-header"><h2>Booking preferences</h2></div><div class="portal-card-body">
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked /><label class="form-check-label">Enable self-service booking</label></div>
            <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked /><label class="form-check-label">Auto-approve simple bookings</label></div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" /><label class="form-check-label">Send reminder automations</label></div>
          </div></section></div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/portal.js"></script>
</body>
</html>
