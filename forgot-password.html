<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – IronTemple</title>
  <meta name="description" content="Reset your IronTemple account password securely." />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background-color: var(--light-bg);">
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon"><i class="fa-solid fa-dumbbell"></i></div>
        IronTemple
      </a>
      <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
        <a href="login.html" class="btn btn-outline-primary">Back to Login</a>
      </div>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="container d-flex justify-content-center">
      <div class="auth-card" style="max-width: 520px;">
        <div class="auth-header">
          <div class="brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.3rem;">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h2>Reset your password</h2>
          <p>Enter your email and we’ll send a reset link.</p>
        </div>

        <form action="" method="POST" novalidate>
          <div class="mb-3">
            <label for="reset-email" class="form-label">Email Address *</label>
            <input type="email" id="reset-email" name="resetEmail" class="form-control" placeholder="name@example.com" required />
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
            <i class="fa-solid fa-paper-plane me-2"></i> Send reset link
          </button>

          <a href="login.html" class="btn btn-outline-primary w-100">
            <i class="fa-solid fa-arrow-left me-2"></i> Back to login
          </a>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer-custom">
    <div class="container">
      <div class="footer-bottom mt-0 pt-0 border-0 text-center">
        <p class="mb-0">© 2026 IronTemple. All rights reserved.</p>
      </div>
    </div>
  </footer>
</body>
</html>
